<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIKA MOVIE BOX UPDATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#07070f;
  --glass:rgba(255,255,255,0.07);
  --glass-b:rgba(255,255,255,0.12);
  --accent:#7c6fff;
  --accent2:#c471ed;
  --text:#f0f0ff;
  --sub:rgba(240,240,255,0.5);
  --sub2:rgba(240,240,255,0.28);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:'Inter',-apple-system,sans-serif;color:var(--text);overflow-x:hidden}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");opacity:.4;z-index:1;pointer-events:none}
.page{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:clamp(28px,5vw,64px) 20px;padding-top:calc(env(safe-area-inset-top,0px) + clamp(28px,5vw,64px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}

/* header */
header{text-align:center;margin-bottom:44px;animation:fadeDown .7s cubic-bezier(.16,1,.3,1) both}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
header h1{font-size:clamp(22px,5vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.1;background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,.65) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* card */
.card{width:100%;max-width:400px;background:var(--glass);border:1px solid var(--glass-b);border-radius:28px;padding:28px 24px 24px;backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);box-shadow:0 32px 80px rgba(0,0,0,.6),0 0 0 1px var(--glass-b);animation:fadeUp .75s cubic-bezier(.16,1,.3,1) .1s both;transition:transform .4s cubic-bezier(.16,1,.3,1),box-shadow .4s}
.card:hover{transform:translateY(-4px) scale(1.005);box-shadow:0 48px 100px rgba(0,0,0,.7),0 0 0 1px rgba(124,111,255,.3)}

/* icon */
.icon-wrap{display:flex;justify-content:center;margin-bottom:20px}
.icon-ring{position:relative;width:96px;height:96px}
.ring-svg{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);animation:spin 8s linear infinite}
.icon-bg{width:96px;height:96px;border-radius:24px;background:linear-gradient(145deg,#1a0a3a,#0d0520,#1a0a3a);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;animation:pulse 3s ease-in-out infinite;box-shadow:0 8px 32px rgba(124,111,255,.4),inset 0 1px 0 rgba(255,255,255,.15)}
.icon-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 35% 30%,rgba(124,111,255,.3) 0%,transparent 65%)}
.icon-bg img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1;display:none}
.icon-bg svg{width:56px;height:56px;position:relative;z-index:1;filter:drop-shadow(0 2px 8px rgba(124,111,255,.6))}

/* app info */
.app-info{text-align:center;margin-bottom:16px}
.app-name{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.app-sub{font-size:12px;color:var(--sub)}

/* stats row */
.stats-row{display:flex;justify-content:center;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.stat-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:50px;font-size:12px;font-weight:600;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--sub)}
.stat-chip.accent{background:linear-gradient(135deg,rgba(124,111,255,.25),rgba(196,113,237,.25));border-color:rgba(124,111,255,.35);color:#c0b8ff;animation:chipGlow 2.5s ease-in-out infinite}
.stat-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);flex-shrink:0}

/* loading state */
.stat-chip.loading{opacity:.5}
.stat-chip.loading span{display:inline-block;animation:blink 1.2s ease-in-out infinite}

/* divider */
.divider{height:1px;background:var(--glass-b);margin:0 -4px 18px}

/* whats new */
.wn-title{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);margin-bottom:10px}
.wn-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:rgba(124,111,255,.08);border:1px solid rgba(124,111,255,.12);border-radius:12px;font-size:13px;color:rgba(240,240,255,.8);line-height:1.4;margin-bottom:8px;transition:background .25s,transform .25s;cursor:default}
.wn-item:hover{background:rgba(124,111,255,.15);transform:translateX(3px)}
.wn-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);margin-top:5px;flex-shrink:0}
.wn-items{margin-bottom:20px}

/* button */
.dl-btn{width:100%;padding:16px 24px;border-radius:18px;border:none;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:-.01em;color:#fff;background:linear-gradient(135deg,#7c6fff,#c471ed);box-shadow:0 0 40px rgba(124,111,255,.5),0 8px 32px rgba(124,111,255,.35);position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.dl-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,transparent 60%);border-radius:inherit}
.dl-btn::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.25) 0%,transparent 60%);opacity:0;transition:opacity .3s;border-radius:inherit}
.dl-btn:hover::after{opacity:1}
.dl-btn:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 0 60px rgba(124,111,255,.65),0 12px 40px rgba(124,111,255,.45)}
.dl-btn:active{transform:scale(.97)}
.dl-btn.disabled{opacity:.5;pointer-events:none}
.btn-icon{animation:bounce 2s ease-in-out infinite}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rippleA .6s linear forwards;pointer-events:none}

.footer{margin-top:14px;text-align:center;font-size:11px;color:var(--sub2);animation:fadeUp .8s cubic-bezier(.16,1,.3,1) .3s both}

/* animations */
@keyframes fadeDown{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 8px 32px rgba(124,111,255,.4),inset 0 1px 0 rgba(255,255,255,.15)}50%{box-shadow:0 8px 48px rgba(124,111,255,.65),inset 0 1px 0 rgba(255,255,255,.15)}}
@keyframes chipGlow{0%,100%{box-shadow:none}50%{box-shadow:0 0 14px rgba(124,111,255,.4)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes rippleA{to{transform:scale(4);opacity:0}}
@keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

          <defs><linearGradient id="rg" x1="0" y1="0" x2="112" y2="112" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#7c6fff" stop-opacity=".8"/><stop offset="50%" stop-color="#c471ed" stop-opacity=".3"/><stop offset="100%" stop-color="#7c6fff" stop-opacity=".8"/></linearGradient></defs>

<script>
/* ── GITHUB AUTO-DETECT ── */
const REPO   = 'itsmems97/Pika-Movie-Box-PIKAZOO';
const BRANCH = 'main';
const FILE   = 'Pika.apk';   // file in repo (name never changes)
const ICON   = 'Pika.png';
const RAW     = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/`;
const RAW_URL = RAW + encodeURIComponent(FILE);
const API_URL = `https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(FILE)}`;
const $ = id => document.getElementById(id);

/* downloaded file name: Pika-Movie-Update-<version>.apk */
const makeName = v => v ? `Pika-Movie-Update-${v}.apk` : 'Pika-Movie-Update.apk';
const clean = v => String(v).trim().replace(/^v/i,'').replace(/[^\w.+\-]/g,'');
let VERSION = null, APK_SIZE = 0;

/* app icon from repo (falls back to built-in SVG) */
(function(){
  const im = $('appIcon');
  im.onload = () => { im.style.display='block'; $('fallbackIcon').style.display='none'; };
  im.src = RAW + encodeURIComponent(ICON);
})();

/* ── APK VERSION READER (reads versionName straight from the APK) ── */
const _td = new TextDecoder();
function readPool(v, o){
  const n = v.getUint32(o+8,true), flags = v.getUint32(o+16,true),
        ss = v.getUint32(o+20,true), hs = v.getUint16(o+2,true);
  const utf8 = (flags & 0x100) !== 0, out = [];
  for(let i=0;i<n;i++){
    let p = o + ss + v.getUint32(o+hs+i*4, true);
    if(utf8){
      let l = v.getUint8(p++); if(l & 0x80) p++;
      let bl = v.getUint8(p++); if(bl & 0x80) bl = ((bl & 0x7f) << 8) | v.getUint8(p++);
      out.push(_td.decode(new Uint8Array(v.buffer, v.byteOffset + p, bl)));
    }else{
      let l = v.getUint16(p,true); p += 2;
      if(l & 0x8000){ l = ((l & 0x7fff) << 16) | v.getUint16(p,true); p += 2; }
      let t = ''; for(let j=0;j<l;j++) t += String.fromCharCode(v.getUint16(p+j*2,true));
      out.push(t);
    }
  }
  return out;
}
function axmlVersion(buf){
  const v = new DataView(buf); let o = 8, strings = null;
  while(o + 8 <= v.byteLength){
    const type = v.getUint16(o,true), sz = v.getUint32(o+4,true);
    if(type === 0x0001) strings = readPool(v,o);
    else if(type === 0x0102 && strings && strings[v.getUint32(o+20,true)] === 'manifest'){
      const as = v.getUint16(o+24,true), asz = v.getUint16(o+26,true), ac = v.getUint16(o+28,true);
      for(let i=0;i<ac;i++){
        const a = o + 16 + as + i*asz;
        if(strings[v.getUint32(a+4,true)] === 'versionName'){
          const raw = v.getUint32(a+8,true);
          if(raw !== 0xFFFFFFFF) return strings[raw];
          if(v.getUint8(a+15) === 3) return strings[v.getUint32(a+16,true)];
        }
      }
      return null;
    }
    if(sz < 8) break; o += sz;
  }
  return null;
}
async function apkVersion(size, read){
  const tailLen = Math.min(size, 66000), tailStart = size - tailLen;
  const tail = new DataView(await read(tailStart, tailLen));
  let e = -1;
  for(let i=tailLen-22;i>=0;i--) if(tail.getUint32(i,true) === 0x06054b50){ e = i; break; }
  if(e < 0) throw new Error('no zip');
  const cdSize = tail.getUint32(e+12,true), cdOff = tail.getUint32(e+16,true);
  const cd = cdOff >= tailStart ? new DataView(tail.buffer, cdOff - tailStart, cdSize)
                                : new DataView(await read(cdOff, cdSize));
  let p = 0, ent = null;
  while(p + 46 <= cd.byteLength && cd.getUint32(p,true) === 0x02014b50){
    const nl = cd.getUint16(p+28,true), xl = cd.getUint16(p+30,true), cl = cd.getUint16(p+32,true);
    const name = _td.decode(new Uint8Array(cd.buffer, cd.byteOffset + p + 46, nl));
    if(name === 'AndroidManifest.xml'){
      ent = {method: cd.getUint16(p+10,true), cs: cd.getUint32(p+20,true), lo: cd.getUint32(p+42,true)};
      break;
    }
    p += 46 + nl + xl + cl;
  }
  if(!ent) throw new Error('no manifest');
  const lh = await read(ent.lo, ent.cs + 8192);
  const L = new DataView(lh);
  const start = 30 + L.getUint16(26,true) + L.getUint16(28,true);
  if(start + ent.cs > lh.byteLength) throw new Error('short read');
  let data = new Uint8Array(lh, start, ent.cs);
  if(ent.method === 8){
    data = new Uint8Array(await new Response(
      new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  }
  const ver = axmlVersion(data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength));
  return ver ? clean(ver) : null;
}
/* read only the needed bytes of the remote APK (HTTP Range) */
async function remoteRead(start, len){
  const r = await fetch(RAW_URL, {headers:{Range:`bytes=${start}-${start+len-1}`}});
  if(r.status !== 206){ try{ r.body.cancel(); }catch(e){} throw new Error('no range'); }
  return r.arrayBuffer();
}
/* ── END APK READER ── */

/* fallback version: 1) version.json in repo  2) latest GitHub release tag */
async function detectVersion(){
  try{
    const r = await fetch(RAW + 'version.json?t=' + Date.now(), {cache:'no-store'});
    if(r.ok){ const j = await r.json(); const v = j.version || j.versionName; if(v) return clean(v); }
  }catch(e){}
  try{
    const r = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`);
    if(r.ok){ const j = await r.json(); if(j.tag_name) return clean(j.tag_name); }
  }catch(e){}
  return null;
}

async function fetchMeta(){
  const btn = $('dlBtn'), bt = $('btnText');
  const verP = detectVersion();
  let missing = false;

  // size
  try{
    const r = await fetch(API_URL, {headers:{'Accept':'application/vnd.github.v3+json'}});
    if(r.status === 404) missing = true;
    else if(r.ok){
      const d = await r.json();
      APK_SIZE = d.size;
      $('sizeText').textContent = (d.size/1048576).toFixed(1) + ' MB';
    }
  }catch(e){}

  if(missing){
    $('verText').textContent = '—';
    $('chipSize').style.display = 'none';
    $('chipDate').style.display = 'none';
    bt.textContent = 'Update not available';
    return;
  }

  // version
  let apkVer = null;
  if(APK_SIZE){ try{ apkVer = await apkVersion(APK_SIZE, remoteRead); }catch(e){} }
  VERSION = apkVer || await verP;
  $('verText').textContent = VERSION ? 'v' + VERSION : 'Latest';

  // date
  try{
    const cr = await fetch(`https://api.github.com/repos/${REPO}/commits?path=${encodeURIComponent(FILE)}&per_page=1`);
    if(cr.ok){
      const cd = await cr.json();
      if(cd.length) $('dateText').textContent = new Date(cd[0].commit.author.date)
        .toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    }
  }catch(e){}

  // hide chips that stayed empty
  if($('sizeText').textContent.trim() === '— MB') $('chipSize').style.display = 'none';
  if($('dateText').textContent.trim() === '—')    $('chipDate').style.display = 'none';

  btn.href = RAW_URL;
  btn.classList.remove('disabled');
  bt.textContent = 'Download Latest Version';
}
fetchMeta();

/* download with detected version in file name */
$('dlBtn').addEventListener('click', async function(e){
  if(this.classList.contains('disabled')) return;
  e.preventDefault();
  const bt = $('btnText');
  this.classList.add('disabled');
  try{
    const r = await fetch(RAW_URL);
    if(!r.ok) throw new Error(r.status);
    const total = +r.headers.get('content-length') || 0;
    const reader = r.body.getReader(), chunks = [];
    let got = 0;
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      chunks.push(value); got += value.length;
      bt.textContent = total ? `Downloading… ${Math.round(got/total*100)}%`
                             : `Downloading… ${(got/1048576).toFixed(1)} MB`;
    }
    const blob = new Blob(chunks,{type:'application/vnd.android.package-archive'});
    let dv = VERSION;
    try{ const pv = await apkVersion(blob.size, (s,l)=>blob.slice(s,s+l).arrayBuffer()); if(pv) dv = pv; }catch(e){}
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = makeName(dv);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    bt.textContent = 'Download started ✓';
  }catch(err){
    window.location.href = RAW_URL;   // fallback: plain download (repo file name)
  }
  setTimeout(()=>{ bt.textContent = 'Download Latest Version'; this.classList.remove('disabled'); }, 3000);
});

/* ── RIPPLE ── */
document.getElementById('dlBtn').addEventListener('click',function(e){
  if(this.classList.contains('disabled'))return;
  const rect=this.getBoundingClientRect();
  const rp=document.createElement('span');
  rp.className='ripple';
  const sz=Math.max(rect.width,rect.height);
  rp.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX-rect.left-sz/2}px;top:${e.clientY-rect.top-sz/2}px`;
  this.appendChild(rp);
  setTimeout(()=>rp.remove(),620);
});

/* ── MOUSE GLOW ── */
document.getElementById('dlBtn').addEventListener('mousemove',function(e){
  const r=this.getBoundingClientRect();
  this.style.setProperty('--mx',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');
  this.style.setProperty('--my',((e.clientY-r.top)/r.height*100).toFixed(1)+'%');
});

/* ── CARD TILT ── */
const card=document.getElementById('mainCard');
card.addEventListener('mousemove',function(e){
  const r=this.getBoundingClientRect();
  const dx=(e.clientX-r.left-r.width/2)/(r.width/2);
  const dy=(e.clientY-r.top-r.height/2)/(r.height/2);
  this.style.transform=`perspective(900px) rotateY(${dx*4}deg) rotateX(${-dy*4}deg) translateY(-4px) scale(1.005)`;
});
card.addEventListener('mouseleave',function(){this.style.transform='';});

/* ── WN STAGGER ── */
document.querySelectorAll('.wn-item').forEach((el,i)=>{
  el.style.opacity='0';el.style.transform='translateX(-12px)';
  setTimeout(()=>{
    el.style.transition='opacity .5s,transform .5s cubic-bezier(.16,1,.3,1)';
    el.style.opacity='1';el.style.transform='';
  },600+i*100);
});

/* ── PARTICLES ── */
(function(){
  const cv=document.getElementById('bg-canvas');
  const cx=cv.getContext('2d');
  let W,H;
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  const pts=Array.from({length:55},()=>({
    x:Math.random()*2000,y:Math.random()*2000,
    r:Math.random()*1.8+.3,
    vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,
    a:Math.random()*.5+.1,h:Math.random()>.5?258:285
  }));
  const orbs=[
    {x:.25,y:.3,r:.45,c:'rgba(90,60,255,0.18)'},
    {x:.75,y:.65,r:.4,c:'rgba(196,113,237,0.14)'},
    {x:.5,y:.1,r:.35,c:'rgba(60,40,180,0.12)'},
  ];
  function draw(){
    cx.clearRect(0,0,W,H);
    orbs.forEach(o=>{
      const g=cx.createRadialGradient(o.x*W,o.y*H,0,o.x*W,o.y*H,o.r*Math.max(W,H));
      g.addColorStop(0,o.c);g.addColorStop(1,'transparent');
      cx.fillStyle=g;cx.fillRect(0,0,W,H);
    });
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      cx.beginPath();cx.arc(p.x%W,p.y%H,p.r,0,Math.PI*2);
      cx.fillStyle=`hsla(${p.h},80%,75%,${p.a})`;cx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
